<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <input class="input" type="text" placeholder="Search...">
        <div class="card-container">
            <div class="card-track">
                <div class="card">
                    <img class="bg-img" src="https://i.pinimg.com/736x/ce/ad/94/cead941fca1ea8075e01f564f1eedf98.jpg" alt="User Avatar">
                    <div class="content">
                        <h2 class="name">John Doe</h2>
                        <p class="bio">Too cool to be true so that it can be the best of all int all the things</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
